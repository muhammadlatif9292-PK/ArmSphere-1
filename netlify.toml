[build]
  command = "npm run build"
  publish = "apps/admin-web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_ENV = "development"

[functions]
  node_bundler = "esbuild"

# Content-Security-Policy mirrors apps/api/src/middlewares/security.ts so the
# SPA is protected identically whether served by the API or by Netlify CDN.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://api.armsphere.com; frame-src https://www.youtube.com https://www.tiktok.com https://www.facebook.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=15552000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/auth/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/sync/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
