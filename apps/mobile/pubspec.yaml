name: mobile
description: ArmSphere mobile application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  audioplayers: ^6.8.1
  cached_network_image: ^3.4.1
  connectivity_plus: ^5.0.2
  crypto: ^3.0.7
  device_info_plus: ^9.1.2
  dio: ^5.11.0
  firebase_core: ^2.32.0
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^16.3.3
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_stripe: ^10.2.0
  freezed_annotation: ^2.4.4
  go_router: ^10.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.2.3
  intl: ^0.18.1
  json_annotation: ^4.9.0
  local_auth: ^2.3.0
  package_info_plus: ^4.2.0
  pretty_dio_logger: ^1.4.0
  riverpod: ^2.6.1
  uuid: ^4.6.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.5.4
  flutter_lints: ^3.0.2
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
