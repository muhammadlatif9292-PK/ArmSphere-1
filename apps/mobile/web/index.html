<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ArmSphere \u2014 competitive armwrestling platform: dual-arm ELO rankings, tournaments, matches, and community.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ArmSphere">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#0B0F19">
  <meta name="color-scheme" content="dark">

  <title>ArmSphere</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Matches AppTheme.background (0xFF0B0F19) so there is no white flash
       before the Flutter engine attaches and paints the real splash screen. */
    html, body {
      background: #0B0F19;
      height: 100%;
    }
    #loading-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B0F19;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div id="loading-splash">Loading ArmSphere</div>
  <script>
    // Remove the pre-engine splash once Flutter's first frame is painted.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading-splash');
      if (el) { el.remove(); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
