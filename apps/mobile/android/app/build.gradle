plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.armsphere.app"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Replace with a production signing config before store submission.
        // Release builds currently fall back to the debug key so CI can verify
        // the production build pipeline (spec section 46 rule: verify real builds).
        applicationId = "com.armsphere.app"
        minSdk = 23
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    def releaseSigningConfig = signingConfigs.debug
    def keystoreProps = new Properties()
    def keystorePropsFile = file('keystore.properties')
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
        signingConfigs.create('productionRelease') {
            storeFile file(keystoreProps['storeFile'] ?: 'upload-keystore.jks')
            storePassword keystoreProps['storePassword']
            keyAlias keystoreProps['keyAlias']
            keyPassword keystoreProps['keyPassword']
        }
        releaseSigningConfig = signingConfigs.productionRelease
    }

    buildTypes {
        release {
            signingConfig releaseSigningConfig
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}
