plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.armsphere.app"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Replace with a production signing config before store submission.
        // Release builds currently fall back to the debug key so CI can verify
        // the production build pipeline (spec section 46 rule: verify real builds).
        applicationId = "com.armsphere.app"
        minSdk = 23
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    def releaseSigningConfig = signingConfigs.debug
    def keystoreProps = new Properties()
    def keyPropsFile = rootProject.file('key.properties')
    def keystorePropsFile = rootProject.file('keystore.properties')
    def propsFile = keyPropsFile.exists() ? keyPropsFile : (keystorePropsFile.exists() ? keystorePropsFile : file('key.properties').exists() ? file('key.properties') : file('keystore.properties'))

    if (propsFile.exists()) {
        keystoreProps.load(new FileInputStream(propsFile))
        signingConfigs.create('productionRelease') {
            def keystorePath = keystoreProps['storeFile'] ?: 'upload-keystore.jks'
            def keystoreFile = file(keystorePath)
            if (!keystoreFile.exists()) {
                keystoreFile = rootProject.file(keystorePath)
            }
            if (!keystoreFile.exists()) {
                keystoreFile = new File(propsFile.parentFile, keystorePath)
            }
            if (!keystoreFile.exists()) {
                keystoreFile = file('upload-keystore.jks')
            }
            if (!keystoreFile.exists()) {
                keystoreFile = rootProject.file('app/upload-keystore.jks')
            }
            storeFile keystoreFile
            storePassword keystoreProps['storePassword']
            keyAlias keystoreProps['keyAlias']
            keyPassword keystoreProps['keyPassword']
        }
        releaseSigningConfig = signingConfigs.productionRelease
    } else if (System.getenv('KEYSTORE_PATH') && System.getenv('KEYSTORE_PASSWORD')) {
        signingConfigs.create('productionRelease') {
            storeFile file(System.getenv('KEYSTORE_PATH'))
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS') ?: 'upload'
            keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
        }
        releaseSigningConfig = signingConfigs.productionRelease
    }

    buildTypes {
        release {
            signingConfig releaseSigningConfig
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    dependencies {
        coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    }
}

flutter {
    source = "../.."
}
