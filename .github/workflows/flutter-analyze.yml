name: ArmSphere Mobile Flutter Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  analyze:
    name: Flutter Analyze & Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install Dependencies
      run: flutter pub get
      working-directory: apps/mobile

    - name: Run Flutter Analyze
      shell: bash
      run: |
        set +e
        flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$RUNNER_TEMP/flutter-analyze.log"
        status=${PIPESTATUS[0]}
        while IFS= read -r line; do
          trimmed=$(printf '%s' "$line" | sed 's/^[[:space:]]*//')
          if [[ "$trimmed" == error*' • '* ]]; then
            message=$(printf '%s' "$trimmed" | awk -F ' • ' '{print $2}')
            location=$(printf '%s' "$trimmed" | awk -F ' • ' '{print $3}')
            file=${location%:*}
            column=${location##*:}
            location_without_column=${file}
            line_number=${location_without_column##*:}
            file=${location_without_column%:*}
            echo "::error file=$file,line=$line_number,col=$column::$message"
          fi
        done < "$RUNNER_TEMP/flutter-analyze.log"
        {
          echo '## Flutter analyzer output'
          echo '```text'
          tail -n 300 "$RUNNER_TEMP/flutter-analyze.log"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit $status
      working-directory: apps/mobile

  build-android-release:
    name: Android Release Build Verification
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Point Android Gradle at Flutter and Android SDKs
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
          echo "flutter.sdk=${FLUTTER_ROOT}" >> android/local.properties
        working-directory: apps/mobile

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate placeholder launcher icons
        run: |
          R=app/src/main/res
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p "$R/mipmap-$d"
            convert -size ${s}x${s} gradient:'#0B1220-#1E293B' \
              -stroke '#38BDF8' -strokewidth $((s/24)) \
              -fill none -draw "ellipse $((s/2)),$((s/2)) $((s*82/200)),$((s*82/200)) -60,240" \
              -fill white -font DejaVu-Sans-Bold -pointsize $((s*40/100)) -gravity center \
              -draw "text 0,$((s/50)) 'AS'" "$R/mipmap-$d/ic_launcher.png"
            convert "$R/mipmap-$d/ic_launcher.png" \
              -resize $((s*66/100))x$((s*66/100)) \
              -background none -gravity center -extent ${s}x${s} \
              "$R/mipmap-$d/ic_launcher_foreground.png"
          done
        working-directory: apps/mobile/android

      - name: Build release APK (production build verification)
        shell: bash
        run: |
          set +e
          flutter build apk --release --verbose 2>&1 | tee "$RUNNER_TEMP/flutter-build.log"
          status=${PIPESTATUS[0]}
          {
            echo '## Android release build output'
            echo '```text'
            tail -n 120 "$RUNNER_TEMP/flutter-build.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '(^|\b)(ERROR|FAILURE|What went wrong|Where|Could not|Execution failed|A problem occurred|Caused by:|^> )' "$RUNNER_TEMP/flutter-build.log" | head -n 80 | while IFS= read -r line; do
            echo "::error title=Android release build::$line"
          done
          exit $status
        working-directory: apps/mobile

      - name: Cleanup temporary signing files
        if: always()
        run: |
          rm -f apps/mobile/android/app/upload-keystore.jks
          rm -f apps/mobile/android/app/keystore.properties
          echo "Temporary signing files removed."

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: armsphere-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
