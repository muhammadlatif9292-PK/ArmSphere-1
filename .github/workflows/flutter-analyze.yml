name: ArmSphere Mobile Flutter Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  analyze:
    name: Flutter Analyze & Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install Dependencies
      run: flutter pub get
      working-directory: apps/mobile

    - name: Display Flutter & Dart Environment
      run: |
        flutter --version
        dart --version
      working-directory: apps/mobile

    - name: Run Flutter Analyze
      shell: bash
      run: |
        set +e
        flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$RUNNER_TEMP/flutter-analyze.log"
        status=${PIPESTATUS[0]}
        while IFS= read -r line; do
          trimmed=$(printf '%s' "$line" | sed 's/^[[:space:]]*//')
          if [[ "$trimmed" == error*' • '* ]]; then
            message=$(printf '%s' "$trimmed" | awk -F ' • ' '{print $2}')
            location=$(printf '%s' "$trimmed" | awk -F ' • ' '{print $3}')
            file=${location%:*}
            column=${location##*:}
            location_without_column=${file}
            line_number=${location_without_column##*:}
            file=${location_without_column%:*}
            echo "::error file=$file,line=$line_number,col=$column::$message"
          fi
        done < "$RUNNER_TEMP/flutter-analyze.log"
        {
          echo '## Flutter analyzer output'
          echo '```text'
          tail -n 300 "$RUNNER_TEMP/flutter-analyze.log"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit $status
      working-directory: apps/mobile

    - name: Run DioClient Endpoint Fail-Safe Unit Tests
      run: flutter test test/dio_client_endpoint_test.dart --reporter=expanded
      working-directory: apps/mobile

    - name: Run ErrorFormatter Unit Tests
      run: flutter test test/error_formatter_test.dart --reporter=expanded
      working-directory: apps/mobile

    - name: Run Biometric Service Tests
      run: flutter test test/biometric_service_test.dart --reporter=expanded
      working-directory: apps/mobile

    - name: Run Repositories Tests
      run: flutter test test/repositories_test.dart --reporter=expanded
      working-directory: apps/mobile

    - name: Run Sprint 17 Caching & Storage Tests
      run: flutter test test/sprint17_test.dart --reporter=expanded
      working-directory: apps/mobile

    - name: Run Widget & UI Tests
      run: flutter test test/widget_test.dart --reporter=expanded
      working-directory: apps/mobile

    - name: Run Discovery & Routing Tests
      run: flutter test test/discovery_and_home_routing_test.dart --reporter=expanded
      working-directory: apps/mobile

    - name: Run Auth Session Teardown Unit Tests
      run: flutter test test/auth_session_teardown_test.dart --reporter=expanded
      working-directory: apps/mobile

    - name: Run Complete Mobile Flutter Test Suite
      run: flutter test --reporter=expanded
      working-directory: apps/mobile

  build-android-release:
    name: Android Release Build Verification
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Point Android Gradle at Flutter and Android SDKs
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
          echo "flutter.sdk=${FLUTTER_ROOT}" >> android/local.properties
        working-directory: apps/mobile

      - name: Verify repository Android launcher icons
        run: |
          R=app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -f "$R/mipmap-$d/ic_launcher.png" || { echo "Missing $R/mipmap-$d/ic_launcher.png"; exit 1; }
            test -f "$R/mipmap-$d/ic_launcher_foreground.png" || { echo "Missing $R/mipmap-$d/ic_launcher_foreground.png"; exit 1; }
          done
          echo "All permanent Android launcher icons verified in repository."
        working-directory: apps/mobile/android

      - name: Display Flutter & Dart Environment
        run: |
          flutter --version
          dart --version
        working-directory: apps/mobile

      - name: Configure Production Signing Keystore
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "Decoding production keystore from repository secrets..."
            mkdir -p android/app/app
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cp android/app/upload-keystore.jks android/upload-keystore.jks
            cp android/app/upload-keystore.jks android/app/app/upload-keystore.jks
            printf "storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$ANDROID_KEYSTORE_PASSWORD" \
              "${ANDROID_KEY_ALIAS:-upload}" \
              "${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" > android/key.properties
            cp android/key.properties android/app/key.properties
            echo "Production release signing configured successfully."
          else
            echo "::warning title=Android Signing::Production signing secrets not present. Building with debug signing fallback."
          fi
        working-directory: apps/mobile

      - name: Build release APK (production build verification)
        shell: bash
        run: |
          set +e
          flutter build apk --release --dart-define=API_BASE_URL=https://armsphere-api-gateway.armsphere.workers.dev --verbose 2>&1 | tee "$RUNNER_TEMP/flutter-build.log"
          status=${PIPESTATUS[0]}
          {
            echo '## Android release build output'
            echo '```text'
            tail -n 120 "$RUNNER_TEMP/flutter-build.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '(^|\b)(ERROR|FAILURE|What went wrong|Where|Could not|Execution failed|A problem occurred|Caused by:|^> )' "$RUNNER_TEMP/flutter-build.log" | head -n 80 | while IFS= read -r line; do
            echo "::error title=Android release build::$line"
          done
          exit $status
        working-directory: apps/mobile

      - name: Build release AppBundle AAB (production store package verification)
        shell: bash
        run: |
          set +e
          flutter build appbundle --release --dart-define=API_BASE_URL=https://armsphere-api-gateway.armsphere.workers.dev --verbose 2>&1 | tee "$RUNNER_TEMP/flutter-aab-build.log"
          status=${PIPESTATUS[0]}
          {
            echo '## Android release AppBundle output'
            echo '```text'
            tail -n 120 "$RUNNER_TEMP/flutter-aab-build.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '(^|\b)(ERROR|FAILURE|What went wrong|Where|Could not|Execution failed|A problem occurred|Caused by:|^> )' "$RUNNER_TEMP/flutter-aab-build.log" | head -n 80 | while IFS= read -r line; do
            echo "::error title=Android release AppBundle build::$line"
          done
          exit $status
        working-directory: apps/mobile

      - name: Verify Release Artifact Signing State
        run: |
          echo "Inspecting release APK signing certificate..."
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/apk_cert.txt"
          cat "$RUNNER_TEMP/apk_cert.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/apk_cert.txt"; then
            echo "::warning title=Android Signing::Artifact is signed with DEBUG key. A production upload keystore is required before submitting to Google Play."
          else
            echo "✅ Confirmed: Artifact is signed with production release/upload key."
          fi
        working-directory: apps/mobile

      - name: Cleanup temporary signing files
        if: always()
        run: |
          rm -f apps/mobile/android/app/upload-keystore.jks
          rm -f apps/mobile/android/upload-keystore.jks
          rm -f apps/mobile/android/app/app/upload-keystore.jks
          rm -f apps/mobile/android/key.properties
          rm -f apps/mobile/android/app/key.properties
          rm -f apps/mobile/android/keystore.properties
          rm -f apps/mobile/android/app/keystore.properties
          echo "Temporary signing files removed."

      - name: Upload release APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: armsphere-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload release AppBundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: armsphere-release-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
