name: ArmSphere Backend Production Testing CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build, Lint and Test Core Modules
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Monorepo Workspace Dependencies
      run: npm ci

    - name: Run Workspace Syntax Linter
      run: npm run lint

    - name: Build All Monorepo Workspaces
      run: npm run build

    - name: Run Backend Core Test Suites & Collect Coverage
      run: npm --prefix apps/api run test
